deploymentMode: SingleBinary # Modo monolítico

loki:
  auth_enabled: false # Sin multi-tenancy
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem # Almacenamiento en el sistema de archivos
  useTestSchema: true

singleBinary:
  replicas: 1
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false
